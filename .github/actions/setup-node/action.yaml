name: "Node.js with pnpm"
description: "Setup Node.js and pnpm via mise, then install dependencies"

inputs:
  working-directory:
    description: "keyword specifies the working directory where the command is run."
    required: false
    default: "."

runs:
  using: "composite"

  steps:
    - name: Setup mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      env:
        MISE_IGNORED_CONFIG_PATHS: "~/.config/mise/config.toml"
      with:
        cache: ${{ runner.environment == 'github-hosted' }}

    # actions/setup-node の cache: pnpm が担っていた pnpm ストアのキャッシュを補う
    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
      working-directory: ${{ inputs.working-directory }}
