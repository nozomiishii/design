name: "Node.js with pnpm"
description: "Setup Node.js and pnpm via mise, then install dependencies"

inputs:
  working-directory:
    description: "keyword specifies the working directory where the command is run."
    required: false
    default: "."

runs:
  using: "composite"

  steps:
    - name: Setup mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      with:
        cache: ${{ runner.environment == 'github-hosted' }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
      working-directory: ${{ inputs.working-directory }}
