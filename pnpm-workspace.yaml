packages:
  - packages/*

# 依存パッケージのライフサイクルスクリプトの許可リスト
allowBuilds:
  "@swc/core": true # @nozomiishii/eslint-config → @swc-node/register → @swc/core | TypeScript 実行時に必要
  esbuild: true # @nozomiishii/eslint-config → @eslint/config-inspector → esbuild | config inspector のビルド
  lefthook: true # git hooks の同期に必要
  unrs-resolver: true # @nozomiishii/eslint-config → eslint-import-resolver-typescript | eslint 実行に必要

# 自前パッケージは待たず即取り込みたいので除外する。
minimumReleaseAgeExclude:
  - "@nozomiishii/*"

# pinバージョンでインストールする
savePrefix: ""
